# Ping Larry ep03: the FIXED release template (the one the production environment's Required template check names).
#
# Guardrail 1: decide at RUNTIME, not compile time. Every stage stays in the plan. SecurityScan's `condition:`
# reads isProduction when the stage is about to run, after the variable group is loaded; outside production the stage
# shows as Skipped, visibly. DeployProd names its dependencies explicitly, so:
#   - it runs only if Build AND SecurityScan succeeded (a skipped or failed scan blocks the deploy), and
#   - if anyone ever removes SecurityScan from the plan again, the pipeline fails to compile
#     ("depends on unknown stage"), loudly, instead of deploying without a scan.

parameters:
  - name: imageRepository
    type: string
  - name: environment
    type: string
  - name: containerRegistry       # a Docker registry service connection to the ACR
    type: string
    default: acr-meridian-prod
  - name: acrLoginServer
    type: string
    default: acrmeridianprod.azurecr.io

variables:
  - name: imageRef
    value: ${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }}:$(Build.BuildId)

stages:
  - stage: Build
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: BuildImage
        steps:
          - task: Docker@2
            displayName: Build and push image
            inputs:
              command: buildAndPush
              containerRegistry: ${{ parameters.containerRegistry }}
              repository: ${{ parameters.imageRepository }}
              Dockerfile: Dockerfile
              tags: $(Build.BuildId)

  - stage: SecurityScan
    dependsOn: Build
    condition: and(succeeded(), eq(variables['isProduction'], 'true'))
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: TrivyContainerScan
        steps:
          - template: install-trivy.yml
          - task: Docker@2
            displayName: Log in to ACR (so Trivy can pull the image)
            inputs:
              command: login
              containerRegistry: ${{ parameters.containerRegistry }}
          - script: trivy image --severity CRITICAL,HIGH --exit-code 1 --format sarif --output "$(Agent.TempDirectory)/trivy-image.sarif" "$(imageRef)"
            displayName: Scan image for CVEs (fails on critical/high)
          - script: trivy fs --scanners secret --exit-code 1 .
            displayName: Scan the repository for hardcoded secrets
          - publish: $(Agent.TempDirectory)/trivy-image.sarif
            artifact: trivy-results
            displayName: Publish scan evidence
            condition: always()

  - stage: DeployProd
    dependsOn: [Build, SecurityScan]
    condition: and(succeeded('Build'), succeeded('SecurityScan'))
    pool:
      vmImage: ubuntu-latest
    jobs:
      - deployment: Deploy
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "kubectl set image deployment/${{ parameters.imageRepository }} ${{ parameters.imageRepository }}=$(imageRef)"
                  displayName: Deploy

# Ping Larry ep02 (FIXED): Git doesn't forget, so scan all of it. Copy into .github/workflows/ to use.
# Gitleaks scans every commit in the history, not just the latest one: a secret removed in a "remove creds" commit
# is still found. If it finds one, the fix isn't another commit: rotate (better, delete) the credential first.
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the whole history
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # required for repositories owned by an organization

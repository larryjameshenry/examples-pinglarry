# Ping Larry ep01 (FIXED): preview on every pull request, against what's really running, with the policy pack.
# Copy into .github/workflows/ to use. With refresh, the PR comment shows drift as well as the change itself,
# so a reviewer can see when production no longer matches the code.
name: pr-preview
on:
  pull_request:
    paths: ["ep01-hotfix-became-permanent/fixed/**"]
permissions:
  id-token: write
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: drift-check                                    # the read-only identity is enough to preview
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
        working-directory: ep01-hotfix-became-permanent/fixed
      - run: npm ci
        working-directory: ep01-hotfix-became-permanent/fixed/policy
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: prod
          work-dir: ep01-hotfix-became-permanent/fixed
          refresh: true
          policyPacks: ep01-hotfix-became-permanent/fixed/policy
          comment-on-pr: true

name: ep04-fixed-workload
description: "Ping Larry ep04 (fixed): a GPU node pool that ends, scaling to zero when nothing runs on it"
runtime:
  name: nodejs
  options:
    packagemanager: npm
config:
  location:
    type: string
    default: eastus2
  gpuVmSize:
    type: string
    # In the episode: Standard_ND96amsr_A100_v4. A cheap size by default so the example costs little.
    default: Standard_D2s_v5
  gpuMaxCount:
    type: integer
    default: 3
